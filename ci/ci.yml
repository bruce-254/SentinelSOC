name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci_test_secret_key_not_used_in_production
          ENVIRONMENT: test
        run: pytest -v

      - name: Import check (app boots)
        env:
          DATABASE_URL: sqlite:///./ci_boot.db
          SECRET_KEY: ci_test_secret_key_not_used_in_production
          ENVIRONMENT: test
        run: python -c "from app.main import app; print('FastAPI app imported OK:', app.title)"

  frontend:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  docker:
    name: Docker image build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: sentinelsoc-backend:ci
          - service: frontend
            context: ./frontend
            image: sentinelsoc-frontend:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose:
    name: Compose validation & smoke test
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Start the stack
        env:
          POSTGRES_PASSWORD: ci_postgres_password
          SECRET_KEY: ci_secret_key_not_used_in_production
          DEFAULT_ADMIN_PASS: ci_admin_password
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Smoke test the API
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            --retry-all-errors http://localhost:8000/api/health

      - name: Smoke test the UI
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            --retry-all-errors http://localhost:8080/ > /dev/null

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
